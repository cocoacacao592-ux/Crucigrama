let nivelActual = 0;

let solucion = [];

let celdasActivas = new Set();


/* =====================================================
   CREAR CRUCIGRAMA
===================================================== */

function crearCrucigrama(nivel) {

    const principal = nivel.principal;

    const palabras = [];

    /*
       La palabra principal se coloca horizontalmente.
    */

    palabras.push({
        numero: principal.numero,
        palabra: principal.palabra,
        pista: principal.pista,
        direccion: "H",
        fila: 10,
        columna: 10
    });


    /*
       Colocar las palabras verticales.

       La letra indicada por posicionPalabra
       debe coincidir exactamente con la letra
       indicada por posicionPrincipal.
    */

    nivel.verticales.forEach(v => {

        const letraPrincipal =
            principal.palabra[v.posicionPrincipal];

        const letraVertical =
            v.palabra[v.posicionPalabra];


        /*
           COMPROBACIÓN AUTOMÁTICA
        */

        if (letraPrincipal !== letraVertical) {

            console.error(
                "ERROR DE CRUCE:",
                v.palabra,
                letraPrincipal,
                letraVertical
            );

        }


        const filaInicio =
            10 - v.posicionPalabra;


        const columna =
            10 + v.posicionPrincipal;


        palabras.push({

            numero: v.numero,

            palabra: v.palabra,

            pista: v.pista,

            direccion: "V",

            fila: filaInicio,

            columna: columna

        });

    });


    /*
       Encontrar límites del tablero
    */

    let minFila = Infinity;
    let maxFila = -Infinity;

    let minColumna = Infinity;
    let maxColumna = -Infinity;


    palabras.forEach(p => {

        for (
            let i = 0;
            i < p.palabra.length;
            i++
        ) {

            let f = p.fila;
            let c = p.columna;


            if (p.direccion === "H") {
                c += i;
            } else {
                f += i;
            }


            minFila = Math.min(minFila, f);
            maxFila = Math.max(maxFila, f);

            minColumna = Math.min(minColumna, c);
            maxColumna = Math.max(maxColumna, c);

        }

    });


    /*
       Agregar margen
    */

    minFila -= 1;
    maxFila += 1;

    minColumna -= 1;
    maxColumna += 1;


    /*
       Matriz
    */

    const filas =
        maxFila - minFila + 1;

    const columnas =
        maxColumna - minColumna + 1;


    solucion = [];

    celdasActivas.clear();


    for (let f = 0; f < filas; f++) {

        solucion[f] = [];

        for (let c = 0; c < columnas; c++) {

            solucion[f][c] = null;

        }

    }


    /*
       Colocar palabras
    */

    palabras.forEach(p => {

        for (
            let i = 0;
            i < p.palabra.length;
            i++
        ) {

            let f = p.fila - minFila;
            let c = p.columna - minColumna;


            if (p.direccion === "H") {
                c += i;
            } else {
                f += i;
            }


            const letra = p.palabra[i];


            /*
               COMPROBAR CRUCE
            */

            if (
                solucion[f][c] !== null &&
                solucion[f][c] !== letra
            ) {

                console.error(
                    "ERROR: letras diferentes en el mismo cruce."
                );

            }


            solucion[f][c] = letra;

            celdasActivas.add(`${f}-${c}`);

        }

    });


    /*
       Crear números
    */

    const numeros = {};


    palabras.forEach(p => {

        const f =
            p.fila - minFila;

        const c =
            p.columna - minColumna;


        if (!numeros[`${f}-${c}`]) {

            numeros[`${f}-${c}`] = [];

        }


        numeros[`${f}-${c}`].push(p.numero);

    });


    return {
        palabras,
        filas,
        columnas,
        numeros
    };

}


/* =====================================================
   CARGAR NIVEL
===================================================== */

function cargarNivel(numero) {

    nivelActual = numero;

    const nivel = niveles[numero];

    document.getElementById(
        "tituloNivel"
    ).textContent = nivel.nombre;


    /*
       Activar botón
    */

    document.querySelectorAll(
        ".nivel"
    ).forEach((boton, i) => {

        boton.classList.toggle(
            "activo",
            i === numero
        );

    });


    const datos =
        crearCrucigrama(nivel);


    const tablero =
        document.getElementById(
            "crucigrama"
        );


    tablero.innerHTML = "";


    const tamaño =
        window.innerWidth <= 600
            ? 32
            : 42;


    tablero.style.gridTemplateColumns =
        `repeat(${datos.columnas}, ${tamaño}px)`;


    /*
       Crear casillas
    */

    for (
        let f = 0;
        f < datos.filas;
        f++
    ) {

        for (
            let c = 0;
            c < datos.columnas;
            c++
        ) {

            const celda =
                document.createElement("div");


            celda.className = "celda";


            /*
               CASILLA NEGRA
            */

            if (solucion[f][c] === null) {

                celda.classList.add(
                    "negra"
                );

            }


            /*
               CASILLA BLANCA
            */

            else {

                /*
                   Número de inicio
                */

                if (
                    datos.numeros[
                        `${f}-${c}`
                    ]
                ) {

                    const numero =
                        document.createElement(
                            "span"
                        );


                    numero.className =
                        "numero";


                    numero.textContent =
                        datos.numeros[
                            `${f}-${c}`
                        ].join("/");


                    celda.appendChild(
                        numero
                    );

                }


                /*
                   Input
                */

                const input =
                    document.createElement(
                        "input"
                    );


                input.maxLength = 1;


                input.dataset.fila = f;

                input.dataset.columna = c;


                input.addEventListener(
                    "input",
                    function() {

                        this.value =
                            this.value
                                .toUpperCase()
                                .replace(
                                    /[^A-ZÁÉÍÓÚÜÑ]/g,
                                    ""
                                );


                        this.classList.remove(
                            "correcta",
                            "incorrecta"
                        );


                        if (
                            this.value !== ""
                        ) {

                            moverSiguiente(
                                this
                            );

                        }

                    }
                );


                celda.appendChild(
                    input
                );

            }


            tablero.appendChild(
                celda
            );

        }

    }


    /*
       Mostrar pistas
    */

    mostrarPistas(
        datos.palabras
    );


    document.getElementById(
        "mensaje"
    ).textContent = "";

}


/* =====================================================
   MOSTRAR PISTAS
===================================================== */

function mostrarPistas(palabras) {

    const horizontales =
        document.getElementById(
            "horizontales"
        );

    const verticales =
        document.getElementById(
            "verticales"
        );


    horizontales.innerHTML = "";

    verticales.innerHTML = "";


    palabras.forEach(p => {

        const div =
            document.createElement(
                "div"
            );


        div.className =
            "pista";


        div.innerHTML =

        `<span class="numero-pista">
            ${p.numero}
        </span>

        ${p.pista}`;


        if (p.direccion === "H") {

            horizontales.appendChild(
                div
            );

        } else {

            verticales.appendChild(
                div
            );

        }

    });

}


/* =====================================================
   AVANZAR A LA SIGUIENTE CASILLA
===================================================== */

function moverSiguiente(actual) {

    const inputs =
        Array.from(
            document.querySelectorAll(
                "#crucigrama input"
            )
        );


    const posicion =
        inputs.indexOf(actual);


    if (
        posicion >= 0 &&
        posicion < inputs.length - 1
    ) {

        inputs[posicion + 1].focus();

    }

}


/* =====================================================
   COMPROBAR
===================================================== */

function comprobar() {

    const inputs =
        document.querySelectorAll(
            "#crucigrama input"
        );


    let correctas = 0;


    inputs.forEach(input => {

        const f =
            Number(
                input.dataset.fila
            );

        const c =
            Number(
                input.dataset.columna
            );


        const correcta =
            solucion[f][c];


        if (
            input.value.toUpperCase() ===
            correcta
        ) {

            input.classList.add(
                "correcta"
            );

            input.classList.remove(
                "incorrecta"
            );

            correctas++;

        } else {

            input.classList.add(
                "incorrecta"
            );

            input.classList.remove(
                "correcta"
            );

        }

    });


    const total =
        inputs.length;


    const mensaje =
        document.getElementById(
            "mensaje"
        );


    if (
        correctas === total
    ) {

        mensaje.textContent =
            "🎉 ¡Felicidades! ¡Completaste el nivel!";


        if (
            nivelActual <
            niveles.length - 1
        ) {

            setTimeout(() => {

                alert(
                    "🎉 ¡Nivel completado! Ahora puedes jugar el siguiente nivel."
                );

            }, 300);

        }

    } else {

        mensaje.textContent =
            `🔎 ${correctas} de ${total} letras correctas.`;

    }

}


/* =====================================================
   REINICIAR
===================================================== */

function reiniciar() {

    const inputs =
        document.querySelectorAll(
            "#crucigrama input"
        );


    inputs.forEach(input => {

        input.value = "";

        input.classList.remove(
            "correcta",
            "incorrecta"
        );

    });


    document.getElementById(
        "mensaje"
    ).textContent = "";

}
