        overflow-x: auto;
        padding: 15px;

    }

    .tablero {
        position: relative;
        display: grid;
        gap: 0;
        background: #222;
        border: 2px solid #222;
    }

    .casilla {
        width: 34px;
        height: 34px;
        background: white;
        border: 1px solid #333;
        position: relative;
    }

    .casilla input {
        width: 100%;
        height: 100%;
        border: 0;
        text-align: center;
        font-size: 22px;
        font-weight: bold;
        text-transform: uppercase;
        outline: none;
        background: transparent;
        padding-top: 5px;
    }

    .casilla input:focus {
        background: #fff4a8;
    }

    .casilla.correcta {
        background: #b9f6c3;
    }

    .casilla.incorrecta {
        background: #ffb5b5;
    }

    .casilla.vacia {
        background: #222;
        border: 1px solid #222;
    }

    .numero {
        position: absolute;
        top: 1px;
        left: 3px;
        font-size: 10px;
        font-weight: bold;
        z-index: 2;
        color: #222;
    }

    .pistas {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 25px;
        margin-top: 15px;
    }

    .pistas h3 {
        margin-bottom: 10px;

    }

    .botones {

        margin-top: 20px;
    }

    button {

        border-radius: 8px;

        font-size: 15px;
        font-weight: bold;
    }

    }

    }

        font-size: 18px;

            height: 29px;
        }

        }

// Calcula las dimensiones del tablero
function obtenerDimensiones(palabras) {

    let maxFila = 0;
    let maxColumna = 0;

    palabras.forEach(p => {

        if (p.direccion === "H") {
            maxFila = Math.max(maxFila, p.fila);
            maxColumna = Math.max(
                maxColumna,
                p.columna + p.palabra.length - 1
            );
        } else {
            maxFila = Math.max(
                maxFila,
                p.fila + p.palabra.length - 1
            );

            maxColumna = Math.max(
                maxColumna,
                p.columna
            );
        }

    });

    return {
        filas: maxFila + 1,
        columnas: maxColumna + 1
    };
}


// Calcula los números de inicio
function obtenerNumeros(palabras) {

    const posiciones = new Map();

    palabras.forEach(p => {

        const clave = p.fila + "," + p.columna;

        if (!posiciones.has(clave)) {
            posiciones.set(clave, 0);
        }

    });

    const ordenadas = Array.from(posiciones.keys()).sort((a,b) => {

        const [fa, ca] = a.split(",").map(Number);
        const [fb, cb] = b.split(",").map(Number);

        if (fa !== fb) return fa - fb;

        return ca - cb;
    });

    const numeros = {};

    ordenadas.forEach((pos, indice) => {
        numeros[pos] = indice + 1;
    });

    return numeros;
}


// Crea un nivel

            class="resultado"
            id="resultado-${indiceNivel}">
        </div>
    `;

    document.getElementById("juego").appendChild(nivelDiv);

    crearTablero(

}


// Crea la cuadrícula
function crearTablero(
    nivel,
    indiceNivel,
    dimensiones,
    numeros
) {

    const tablero =
        document.getElementById(
            `tablero-${indiceNivel}`
        );

    const celdas = {};

    nivel.palabras.forEach(p => {

        for (
            let i = 0;
            i < p.palabra.length;
            i++
        ) {

            const fila =
                p.fila +
                (p.direccion === "V" ? i : 0);

            const columna =
                p.columna +
                (p.direccion === "H" ? i : 0);

            const clave =
                fila + "," + columna;

            celdas[clave] = true;
        }

    });


    for (
        let fila = 0;
        fila < dimensiones.filas;
        fila++
    ) {

        for (
            let columna = 0;
            columna < dimensiones.columnas;
            columna++
        ) {

            const clave =
                fila + "," + columna;

            const celda =
                document.createElement("div");

            celda.className = "casilla";

            if (celdas[clave]) {

                const input =
                    document.createElement("input");

                input.maxLength = 1;
                input.dataset.fila = fila;
                input.dataset.columna = columna;

                input.addEventListener(
                    "input",
                    function() {
                        this.value =
                            this.value
                            .toUpperCase()
                            .replace(/[^A-ZÑ]/g, "");
                    }
                );

                celda.appendChild(input);

                if (numeros[clave]) {

                    const numero =
                        document.createElement("span");

                    numero.className = "numero";
                    numero.textContent =
                        numeros[clave];

                    celda.appendChild(numero);
                }

            } else {

                celda.className =
                    "casilla vacia";
            }

            tablero.appendChild(celda);
        }
    }
}


// Crea las pistas
function crearPistas(
    nivel,
    indiceNivel,
    numeros
) {

    const horizontales =
        document.getElementById(
            `horizontales-${indiceNivel}`
        );

    const verticales =
        document.getElementById(
            `verticales-${indiceNivel}`
        );


    nivel.palabras.forEach(p => {

        const numero =
            numeros[
                p.fila + "," + p.columna
            ];

        const pista =
            document.createElement("div");

        pista.className = "pista";

        pista.innerHTML =
            `<strong>${numero}.</strong> ${p.pista}`;

        if (p.direccion === "H") {
            horizontales.appendChild(pista);
        } else {
            verticales.appendChild(pista);
        }

    });
}


// Comprueba las respuestas
function comprobar(indiceNivel) {

    const nivel =
        niveles[indiceNivel];

    const tablero =
        document.getElementById(
            `tablero-${indiceNivel}`
        );

    const inputs =
        tablero.querySelectorAll("input");

    let correctas = 0;
    let total = 0;


    inputs.forEach(input => {

        const fila =
            Number(input.dataset.fila);

        const columna =
            Number(input.dataset.columna);

        let letraCorrecta = null;


        nivel.palabras.forEach(p => {

            for (
                let i = 0;
                i < p.palabra.length;
                i++
            ) {

                const f =
                    p.fila +
                    (p.direccion === "V"
                        ? i
                        : 0);

                const c =
                    p.columna +
                    (p.direccion === "H"
                        ? i
                        : 0);

                if (
                    f === fila &&
                    c === columna
                ) {

                    letraCorrecta =
                        p.palabra[i];
                }

            }

        });


        if (letraCorrecta) {

            total++;

            if (
                input.value.toUpperCase() ===
                letraCorrecta
            ) {

                input.parentElement
                    .classList.add("correcta");

                input.parentElement
                    .classList.remove("incorrecta");

                correctas++;

            } else {

                input.parentElement
                    .classList.add("incorrecta");

                input.parentElement
                    .classList.remove("correcta");
            }
        }

    });


    const resultado =
        document.getElementById(
            `resultado-${indiceNivel}`
        );


    if (correctas === total) {

        resultado.textContent =
            "🎉 ¡Excelente! ¡Crucigrama completado correctamente!";

    } else {

        resultado.textContent =
            `Tienes ${correctas} de ${total} letras correctas.`;
    }
}


// Borra las respuestas
function borrarNivel(indiceNivel) {

    const tablero =
        document.getElementById(
            `tablero-${indiceNivel}`
        );

    const inputs =
        tablero.querySelectorAll("input");

    inputs.forEach(input => {

        input.value = "";

        input.parentElement
            .classList.remove("correcta");

        input.parentElement
            .classList.remove("incorrecta");

    });


    document.getElementById(
        `resultado-${indiceNivel}`
    ).textContent = "";
}


// Crear los 5 niveles
niveles.forEach(
    (nivel, indice) => {
        crearNivel(nivel, indice);
    }
);

</script>
