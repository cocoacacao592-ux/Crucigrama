/* =====================================================
   VARIABLES
===================================================== */

let nivelActual = 0;

let solucion = [];


/* =====================================================
   CARGAR NIVEL
===================================================== */

function cargarNivel(numero) {

    nivelActual = numero;

    const nivel = niveles[numero];

    document.getElementById("tituloNivel").textContent =
        nivel.nombre;


    /* Activar botón del nivel */

    document.querySelectorAll(".nivel").forEach((boton, i) => {

        boton.classList.toggle(
            "activo",
            i === numero
        );

    });


    const tablero =
        document.getElementById("crucigrama");

    tablero.innerHTML = "";


    /* Tamaño de las casillas */

    const tamaño =
        window.innerWidth <= 600 ? 32 : 44;


    tablero.style.gridTemplateColumns =
        `repeat(${nivel.columnas}, ${tamaño}px)`;


    /* =================================================
       CREAR MATRIZ
    ================================================= */

    solucion = [];

    for (let f = 0; f < nivel.filas; f++) {

        solucion[f] = [];

        for (let c = 0; c < nivel.columnas; c++) {

            solucion[f][c] = null;

        }

    }


    /* =================================================
       COLOCAR TODAS LAS PALABRAS
    ================================================= */

    nivel.palabras.forEach(item => {

        for (
            let i = 0;
            i < item.palabra.length;
            i++
        ) {

            let f = item.fila;
            let c = item.columna;


            if (item.direccion === "H") {

                c += i;

            } else {

                f += i;

            }


            /*
               Si ya existe una letra en esa casilla,
               comprobamos que sea la misma.
            */

            if (solucion[f][c] !== null) {

                if (solucion[f][c] !== item.palabra[i]) {

                    console.error(
                        "Error de cruce:",
                        item.palabra
                    );

                }

            } else {

                solucion[f][c] =
                    item.palabra[i];

            }

        }

    });


    /* =================================================
       CREAR TABLERO
    ================================================= */

    for (let f = 0; f < nivel.filas; f++) {

        for (let c = 0; c < nivel.columnas; c++) {

            const celda =
                document.createElement("div");

            celda.className = "celda";


            /* Buscar si aquí comienza una palabra */

            const palabrasInicio =
                nivel.palabras.filter(item =>
                    item.fila === f &&
                    item.columna === c
                );


            /* CASILLA NEGRA */

            if (solucion[f][c] === null) {

                celda.classList.add("negra");

            }


            /* CASILLA CON LETRA */

            else {

                /*
                   Si empieza una o más palabras,
                   mostrar su número.
                */

                if (palabrasInicio.length > 0) {

                    const numero =
                        document.createElement("span");

                    numero.className = "numero";

                    numero.textContent =
                        palabrasInicio
                            .map(p => p.numero)
                            .join("/");

                    celda.appendChild(numero);

                }


                /* Crear campo de texto */

                const input =
                    document.createElement("input");

                input.maxLength = 1;

                input.dataset.fila = f;

                input.dataset.columna = c;


                /* Escribir en mayúsculas */

                input.addEventListener(
                    "input",
                    function() {

                        this.value =
                            this.value.toUpperCase();

                        this.classList.remove(
                            "correcta",
                            "incorrecta"
                        );


                        /* Avanzar automáticamente */

                        if (this.value !== "") {

                            moverSiguiente(this);

                        }

                    }
                );


                celda.appendChild(input);

            }


            tablero.appendChild(celda);

        }

    }


    mostrarPistas(nivel);

    document.getElementById("mensaje").textContent = "";

}


/* =====================================================
   PASAR A LA SIGUIENTE CASILLA
===================================================== */

function moverSiguiente(inputActual) {

    const inputs =
        Array.from(
            document.querySelectorAll(
                "#crucigrama input"
            )
        );


    const posicion =
        inputs.indexOf(inputActual);


    if (
        posicion >= 0 &&
        posicion < inputs.length - 1
    ) {

        inputs[posicion + 1].focus();

    }

}


/* =====================================================
   MOSTRAR PISTAS
===================================================== */

function mostrarPistas(nivel) {

    const horizontales =
        document.getElementById("horizontales");

    const verticales =
        document.getElementById("verticales");


    horizontales.innerHTML = "";

    verticales.innerHTML = "";


    nivel.palabras.forEach(item => {

        const div =
            document.createElement("div");

        div.className = "pista";


        div.innerHTML =

        `<span class="numero-pista">
            ${item.numero}
        </span>

        ${item.pista}`;


        if (item.direccion === "H") {

            horizontales.appendChild(div);

        } else {

            verticales.appendChild(div);

        }

    });

}


/* =====================================================
   COMPROBAR RESPUESTAS
===================================================== */

function comprobar() {

    const inputs =
        document.querySelectorAll(
            "#crucigrama input"
        );


    let correctas = 0;

    const total = inputs.length;


    inputs.forEach(input => {

        const f =
            Number(input.dataset.fila);

        const c =
            Number(input.dataset.columna);


        const letraCorrecta =
            solucion[f][c];


        if (
            input.value.toUpperCase() ===
            letraCorrecta
        ) {

            input.classList.add("correcta");

            input.classList.remove("incorrecta");

            correctas++;

        }

        else {

            input.classList.add("incorrecta");

            input.classList.remove("correcta");

        }

    });


    const mensaje =
        document.getElementById("mensaje");


    if (correctas === total) {

        mensaje.textContent =
            "🎉 ¡Felicidades! ¡Completaste el nivel!";


        if (nivelActual < niveles.length - 1) {

            setTimeout(() => {

                alert(
                    "🎉 ¡Nivel completado! Puedes pasar al siguiente nivel."
                );

            }, 200);

        }

    }

    else {

        mensaje.textContent =
            `🔎 Tienes ${correctas} de ${total} letras correctas.`;

    }

}


/* =====================================================
   REINICIAR
===================================================== */

function reiniciar() {

    const inputs =
        document.querySelectorAll(

    inputs.forEach(input => {

        input.classList.remove(
