```html
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Crucigrama - 5 Niveles</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #dff6ff, #f1e7ff);
    color: #222;
    text-align: center;
}

header {
    background: #5b4bdb;
    color: white;
    padding: 20px;
}

header h1 {
    margin: 0;
}

.contenedor {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

/* NIVELES */

.niveles {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

.nivel {
    border: none;
    padding: 11px 18px;
    border-radius: 10px;
    background: white;
    cursor: pointer;
    font-weight: bold;
    box-shadow: 0 2px 5px #aaa;
}

.nivel:hover {
    background: #e4e0ff;
}

.nivel.activo {
    background: #5b4bdb;
    color: white;
}

/* JUEGO */

.juego {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 35px;
    flex-wrap: wrap;
}

/* TABLERO */

#crucigrama {
    display: grid;
    gap: 2px;
    background: #222;
    padding: 2px;
}

.celda {
    width: 44px;
    height: 44px;
    background: white;
    position: relative;
}

.celda.negra {
    background: #222;
}

.celda input {
    width: 100%;
    height: 100%;
    border: none;
    outline: none;
    text-align: center;
    font-size: 22px;
    font-weight: bold;
    text-transform: uppercase;
    background: white;
}

/* NÚMERO */

.numero {
    position: absolute;
    top: 2px;
    left: 3px;
    font-size: 10px;
    font-weight: bold;
    color: #444;
    z-index: 2;
    pointer-events: none;
}

/* PISTAS */

.pistas {
    width: 370px;
    background: white;
    padding: 20px;
    border-radius: 15px;
    text-align: left;
    box-shadow: 0 3px 10px #bbb;
}

.pistas h2 {
    color: #5b4bdb;
    margin-top: 0;
}

.pistas h3 {
    border-bottom: 2px solid #ddd;
    padding-bottom: 5px;
}

.pista {
    margin: 12px 0;
    line-height: 1.4;
}

.numero-pista {
    display: inline-block;
    background: #5b4bdb;
    color: white;
    border-radius: 50%;
    width: 25px;
    height: 25px;
    text-align: center;
    line-height: 25px;
    margin-right: 6px;
    font-weight: bold;
}

/* BOTONES */

.botones {
    margin-top: 25px;
}

.botones button {
    border: none;
    padding: 12px 22px;
    margin: 5px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    color: white;
    font-size: 15px;
}

#comprobar {
    background: #28a745;
}

#reiniciar {
    background: #dc3545;
}

#mensaje {
    margin-top: 15px;
    font-size: 18px;
    font-weight: bold;
    min-height: 25px;
}

.correcta {
    background: #b8f5bd !important;
}

.incorrecta {
    background: #ffb3b3 !important;
}

/* CELULAR */

@media (max-width: 600px) {

    .celda {
        width: 32px;
        height: 32px;
    }

    .celda input {
        font-size: 17px;
    }

    .numero {
        font-size: 8px;
    }

    .pistas {
        width: 100%;
    }
}

</style>
</head>

<body>

<header>

<h1>🧩 Crucigrama</h1>

<p>Completa los 5 niveles</p>

</header>

<div class="contenedor">

<div class="niveles">

<button class="nivel activo" onclick="cargarNivel(0)">
Nivel 1
</button>

<button class="nivel" onclick="cargarNivel(1)">
Nivel 2
</button>

<button class="nivel" onclick="cargarNivel(2)">
Nivel 3
</button>

<button class="nivel" onclick="cargarNivel(3)">
Nivel 4
</button>

<button class="nivel" onclick="cargarNivel(4)">
Nivel 5
</button>

</div>

<h2 id="tituloNivel"></h2>

<div class="juego">

<div id="crucigrama"></div>

<div class="pistas">

<h2>📖 Pistas</h2>

<h3>➡️ Horizontales</h3>

<div id="horizontales"></div>

<h3>⬇️ Verticales</h3>

<div id="verticales"></div>

</div>

</div>

<div class="botones">

<button id="comprobar" onclick="comprobar()">
✅ Comprobar
</button>

<button id="reiniciar" onclick="reiniciar()">
🔄 Reiniciar
</button>

</div>

<div id="mensaje"></div>

</div>


<script>

/* ======================================================
   NIVELES
   Las palabras ahora están colocadas para que
   los cruces tengan letras iguales.
====================================================== */

const niveles = [

/* ==========================
   NIVEL 1
========================== */

{
nombre: "Nivel 1 - Fácil",

filas: 7,
columnas: 7,

palabras: [

{
numero: 1,
palabra: "GATO",
fila: 1,
columna: 1,
direccion: "H",
pista: "Animal que maúlla."
},

{
numero: 2,
palabra: "SOL",
fila: 0,
columna: 3,
direccion: "V",
pista: "Estrella que ilumina la Tierra."
},

{
numero: 3,
palabra: "OSO",
fila: 3,
columna: 1,
direccion: "H",
pista: "Animal grande que puede vivir en bosques."
},

{
numero: 4,
palabra: "ROJO",
fila: 1,
columna: 5,
direccion: "V",
pista: "Color de una manzana madura."

}

]
},

/* ==========================
   NIVEL 2
========================== */

{
nombre: "Nivel 2 - Fácil",

filas: 9,
columnas: 9,

palabras: [

{
numero: 1,
palabra: "LUNA",
fila: 2,
columna: 1,
direccion: "H",
pista: "Se puede observar durante la noche."
},

{
numero: 2,
palabra: "MAR",
fila: 1,
columna: 3,
direccion: "V",
pista: "Gran extensión de agua salada."
},

{
numero: 3,
palabra: "PERRO",
fila: 5,
columna: 1,
direccion: "H",
pista: "Animal conocido como el mejor amigo del ser humano."
},

{
numero: 4,
palabra: "RANA",
fila: 3,
columna: 5,
direccion: "V",
pista: "Animal que salta y puede vivir cerca del agua."

}

]
},

/* ==========================
   NIVEL 3
========================== */

{
nombre: "Nivel 3 - Medio",

filas: 10,
columnas: 10,

palabras: [

{
numero: 1,
palabra: "ESCUELA",
fila: 2,
columna: 1,
direccion: "H",
pista: "Lugar donde los estudiantes aprenden."
},

{
numero: 2,
palabra: "LIBRO",
fila: 1,
columna: 3,
direccion: "V",
pista: "Tiene páginas y sirve para leer."
},

{
numero: 3,
palabra: "MUSICA",
fila: 6,
columna: 1,
direccion: "H",
pista: "Arte que utiliza sonidos."
},

{
numero: 4,
palabra: "AMIGO",
fila: 2,
columna: 7,
direccion: "V",
pista: "Persona cercana en quien puedes confiar."

}

]
},

/* ==========================
   NIVEL 4
========================== */

{
nombre: "Nivel 4 - Difícil",

filas: 11,
columnas: 11,

palabras: [

{
numero: 1,
palabra: "PLANETA",
fila: 3,
columna: 1,
direccion: "H",
pista: "Cuerpo celeste que gira alrededor de una estrella."
},

{
numero: 2,
palabra: "ESTRELLA",
fila: 1,
columna: 3,
direccion: "V",
pista: "Objeto brillante que podemos observar en el cielo."
},

{
numero: 3,
palabra: "ANIMAL",
fila: 7,
columna: 1,
direccion: "H",
pista: "Ser vivo que no es una planta."
},

{
numero: 4,
palabra: "NATURALEZA",
fila: 1,
columna: 7,
direccion: "V",
pista: "Conjunto de seres y elementos naturales."

}

]
},

/* ==========================
   NIVEL 5
========================== */

{
nombre: "Nivel 5 - Experto",

filas: 12,
columnas: 12,

palabras: [

{
numero: 1,
palabra: "TECNOLOGIA",
fila: 4,
columna: 1,
direccion: "H",
pista: "Conjunto de conocimientos y herramientas creadas por las personas."
},

{
numero: 2,
palabra: "INTERNET",
fila: 1,
columna: 5,
direccion: "V",
pista: "Red mundial que conecta computadoras y dispositivos."
},

{
numero: 3,
palabra: "CIENCIA",
fila: 8,
columna: 2,
direccion: "H",
pista: "Conocimiento obtenido mediante la observación y experimentación."
},

{
numero: 4,
palabra: "UNIVERSO",
fila: 1,
columna: 10,
direccion: "V",
pista: "Todo lo que existe: espacio, materia y energía."

}

]

}

];


/* ======================================================
   VARIABLES
====================================================== */

let nivelActual = 0;

let solucion = [];


/* ======================================================
   CARGAR NIVEL
====================================================== */

function cargarNivel(numero) {

nivelActual = numero;

const nivel = niveles[numero];

document.getElementById("tituloNivel").textContent =
nivel.nombre;


/* Activar botón */

document.querySelectorAll(".nivel").forEach((boton, i) => {

boton.classList.toggle(
"activo",
i === numero
);

});


const tablero =
document.getElementById("crucigrama");

tablero.innerHTML = "";


/* Tamaño */

let tamaño = window.innerWidth <= 600 ? 32 : 44;

tablero.style.gridTemplateColumns =
`repeat(${nivel.columnas}, ${tamaño}px)`;


/* ======================================================
   CREAR MATRIZ
====================================================== */

solucion = [];

for(let f = 0; f < nivel.filas; f++) {

solucion[f] = [];

for(let c = 0; c < nivel.columnas; c++) {

solucion[f][c] = null;

}

}


/* ======================================================
   COLOCAR PALABRAS
====================================================== */

nivel.palabras.forEach(item => {

for(let i = 0; i < item.palabra.length; i++) {

let f = item.fila;
let c = item.columna;


/* Horizontal */

if(item.direccion === "H") {

c += i;

}

/* Vertical */

else {

f += i;

}


/* Guardar letra */

if(
f >= 0 &&
f < nivel.filas &&
c >= 0 &&
c < nivel.columnas
) {

solucion[f][c] =
item.palabra[i];

}

}

});


/* ======================================================
   CREAR TABLERO
====================================================== */

for(let f = 0; f < nivel.filas; f++) {

for(let c = 0; c < nivel.columnas; c++) {

const celda =
document.createElement("div");

celda.className = "celda";


/* Buscar palabra que comienza aquí */

const palabraInicio =
nivel.palabras.find(item =>
item.fila === f &&
item.columna === c
);


/* Casilla negra */

if(solucion[f][c] === null) {

celda.classList.add("negra");

}


/* Casilla de respuesta */

else {

/* Número */

if(palabraInicio) {

const numero =
document.createElement("span");

numero.className = "numero";

numero.textContent =
palabraInicio.numero;

celda.appendChild(numero);

}


/* Input */

const input =
document.createElement("input");

input.maxLength = 1;

input.dataset.fila = f;

input.dataset.columna = c;


/* Pasar automáticamente a la siguiente casilla */

input.addEventListener("input", function() {

this.value =
this.value.toUpperCase();

this.classList.remove(
"correcta",
"incorrecta"
);

if(this.value !== "") {

moverSiguiente(this);

}

});


celda.appendChild(input);

}


tablero.appendChild(celda);

}

}


mostrarPistas(nivel);

document.getElementById("mensaje").textContent = "";

}


/* ======================================================
   PASAR A LA SIGUIENTE CASILLA
====================================================== */

function moverSiguiente(inputActual) {

const inputs =
Array.from(
document.querySelectorAll("#crucigrama input")
);

const posicion =
inputs.indexOf(inputActual);

if(posicion < inputs.length - 1) {

inputs[posicion + 1].focus();

}

}


/* ======================================================
   PISTAS
====================================================== */

function mostrarPistas(nivel) {

const horizontales =
document.getElementById("horizontales");

const verticales =
document.getElementById("verticales");

horizontales.innerHTML = "";

verticales.innerHTML = "";


nivel.palabras.forEach(item => {

const div =
document.createElement("div");

div.className = "pista";


div.innerHTML =

`<span class="numero-pista">
${item.numero}
</span>

${item.pista}`;


if(item.direccion === "H") {

horizontales.appendChild(div);

}

else {

verticales.appendChild(div);

}

});

}


/* ======================================================
   COMPROBAR
====================================================== */

function comprobar() {

const inputs =
document.querySelectorAll(
"#crucigrama input"
);

let correctas = 0;

const total = inputs.length;


inputs.forEach(input => {

const f =
input.dataset.fila;

const c =
input.dataset.columna;


if(
input.value.toUpperCase() ===
solucion[f][c]
) {

input.classList.add("correcta");

input.classList.remove("incorrecta");

correctas++;

}

else {

input.classList.add("incorrecta");

input.classList.remove("correcta");

}

});


const mensaje =
document.getElementById("mensaje");


if(correctas === total) {

mensaje.textContent =
"🎉 ¡Excelente! ¡Completaste el nivel!";

}

else {

mensaje.textContent =
`🔎 ${correctas} de ${total} letras correctas.`;

}

}


/* ======================================================
   REINICIAR
====================================================== */

function reiniciar() {

const inputs =
document.querySelectorAll(
"#crucigrama input"
);


inputs.forEach(input => {

input.value = "";

input.classList.remove(
"correcta",
"incorrecta"
);

});


document.getElementById("mensaje").textContent = "";

}


/* INICIAR */

cargarNivel(0);

</script>

</body>
</html>
